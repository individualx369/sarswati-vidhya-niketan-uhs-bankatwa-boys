<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | सरस्वती विद्या निकेतन</title>
<style>
:root{--n:#0b2545;--b:#123e6a;--o:#f47b20;--bg:#f5f7fb;--muted:#667085;--line:#e6eaf0;--danger:#b42318}*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Devanagari",sans-serif;background:var(--bg);color:#172033}button,input,textarea,select{font:inherit}button{cursor:pointer}.wrap{max-width:1180px;margin:auto;padding:22px}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.box,.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 15px 50px #10182812}.box{width:min(430px,100%);padding:30px}.logo{width:52px;height:52px;border-radius:15px;background:linear-gradient(135deg,var(--o),#ffb866);display:grid;place-items:center;color:#fff;font-size:25px}.box h1{color:var(--n);font-size:25px;margin:16px 0 5px}.muted{color:var(--muted)}label{display:block;font-weight:700;margin:15px 0 7px}input,textarea,select{width:100%;padding:11px 12px;border:1px solid #d8dee8;border-radius:10px;background:#fff}textarea{min-height:110px;resize:vertical}.primary{background:var(--o);color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:800}.error{color:var(--danger);margin-top:12px;display:none}.dashboard{display:none}.head{background:var(--n);color:#fff}.head .row{display:flex;justify-content:space-between;align-items:center;gap:15px}.logout{background:#fff;color:var(--n);border:0;border-radius:9px;padding:9px 14px;font-weight:800}.tabs{display:flex;gap:8px;overflow:auto;padding:18px 0 4px}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 14px;font-weight:700}.tab.active{background:var(--n);color:#fff}.layout{display:grid;grid-template-columns:360px 1fr;gap:20px;margin-top:20px}.panel{padding:20px}.panel h2{margin:0 0 5px;color:var(--n)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.form-actions{display:flex;gap:10px;margin-top:15px}.secondary{background:#eef2f6;border:0;border-radius:10px;padding:11px 15px;font-weight:700}.danger{color:var(--danger)}.items{display:grid;gap:10px;margin-top:15px}.item{border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}.item strong{display:block;color:var(--n)}.item small{color:var(--muted)}.item-actions{display:flex;gap:8px;margin-top:10px}.item-actions button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px}.status{margin:12px 0;padding:10px;border-radius:9px;background:#eef7f0;color:#176b37;display:none}.help{font-size:12px;color:var(--muted);margin-top:8px}.empty{padding:30px;text-align:center;color:var(--muted)}
@media(max-width:800px){.layout{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.head .row{align-items:flex-start}}
</style>
</head>
<body>
<div id="login" class="login"><form id="loginForm" class="box"><div class="logo">ॐ</div><h1>Admin Login</h1><div class="muted">सरस्वती विद्या निकेतन (मॉडल स्कूल)</div><label>Username</label><input id="username" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" style="width:100%;margin-top:20px">सुरक्षित Login</button><div id="error" class="error">Login असफल। Username या password जाँचें।</div><p class="help">Admin password server-side environment में रखा जाता है।</p></form></div>
<div id="dashboard" class="dashboard">
<header class="head"><div class="wrap row"><div><strong>Admin Dashboard</strong><div style="font-size:13px;color:#d9e5f2">UHS BANKATWA • School Portal</div></div><button id="logout" class="logout">Logout</button></div></header>
<main class="wrap">
<div class="tabs" id="tabs"></div>
<div class="status" id="status"></div>
<div class="layout"><section class="panel"><h2 id="formTitle">नई सूचना</h2><div class="muted" id="formHint">Database content manage करें</div><form id="editor"></form></section><section class="panel"><h2 id="listTitle">Content</h2><div class="muted">Published records</div><div id="items" class="items"><div class="empty">Loading…</div></div></section></div>
</main></div>
<script>
const tables={
 notices:{label:'📢 Notices',title:'Notice Board',fields:[['title','शीर्षक','input',true],['body','विवरण','textarea',true],['published_on','तारीख','date',true],['is_published','Published','checkbox',false]]},
 staff:{label:'👨‍🏫 Staff',title:'Teachers & Staff',fields:[['name','नाम','input',true],['designation','पद','input',true],['subject','विषय','input',false],['photo_url','Photo URL','input',false],['sort_order','क्रम','number',false],['is_published','Published','checkbox',false]]},
 achievements:{label:'🏆 Achievements',title:'Achievements',fields:[['title','शीर्षक','input',true],['description','विवरण','textarea',false],['achievement_date','तारीख','date',false],['image_url','Image URL','input',false],['is_published','Published','checkbox',false]]},
 gallery:{label:'🖼️ Gallery',title:'Photo Gallery',fields:[['title','फोटो शीर्षक','input',true],['image_url','Image URL','input',true],['alt_text','Alt text','input',false],['sort_order','क्रम','number',false],['is_published','Published','checkbox',false]]},
 downloads:{label:'📄 Downloads',title:'Downloads',fields:[['title','दस्तावेज़ नाम','input',true],['file_url','File URL','input',true],['file_type','File type','input',false],['published_on','तारीख','date',true],['is_published','Published','checkbox',false]]},
 site_settings:{label:'🏫 School Info',title:'School Information',fields:[['school_name','विद्यालय का नाम','input',true],['address','पता','textarea',true],['udise_code','U-DISE Code','input',true],['principal_message','प्रधानाचार्य संदेश','textarea',false],['phone','Phone','input',false],['email','Email','input',false]]}
};
let current='notices',editingId=null;
const $=id=>document.getElementById(id);
function renderTabs(){ $('tabs').innerHTML=Object.entries(tables).map(([k,v])=>`<button class="tab ${k===current?'active':''}" data-t="${k}">${v.label}</button>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{current=b.dataset.t;editingId=null;renderTabs();renderForm();load();}); }
function renderForm(data={}){const t=tables[current];$('formTitle').textContent=editingId?'Edit record':t.title;$('formHint').textContent=current==='site_settings'?'विद्यालय की मुख्य जानकारी अपडेट करें':'नया record जोड़ें';$('editor').innerHTML=`<div class="formgrid">${t.fields.map(([key,label,type,required])=>{if(type==='checkbox')return `<label class="full"><input style="width:auto" type="checkbox" id="f_${key}" ${data[key]!==false?'checked':''}> ${label}</label>`;return `<label class="${type==='textarea'?'full':''}">${label}${required?' *':''}${type==='textarea'?`<textarea id="f_${key}" ${required?'required':''}>${esc(data[key]??'')}</textarea>`:`<input id="f_${key}" type="${type}" value="${esc(data[key]??'')}" ${required?'required':''}>`}</label>`}).join('')}</div><div class="form-actions"><button class="primary">${editingId?'Update':'Save'}</button>${editingId?'<button type="button" class="secondary" id="cancel">Cancel</button>':''}</div>`;$('editor').onsubmit=save;if(editingId)$('cancel').onclick=()=>{editingId=null;renderForm();};}
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
async function api(url,opt){const r=await fetch(url,opt);let d=null;try{d=await r.json()}catch{}if(!r.ok)throw new Error(d?.error||'Request failed');return d;}
async function load(){ $('items').innerHTML='<div class="empty">Loading…</div>';try{const data=await api('/api/admin/content?table='+current);$('listTitle').textContent=tables[current].title;if(current==='site_settings'&&data.length){editingId=data[0].id;renderForm(data[0]);} $('items').innerHTML=data.length?data.map(x=>`<div class="item"><strong>${esc(x.title||x.school_name||x.name||'Untitled')}</strong><small>${esc(x.body||x.designation||x.address||x.description||x.file_type||'')}</small><div class="item-actions"><button data-edit="${x.id}">Edit</button>${current!=='site_settings'?'<button class="danger" data-del="'+x.id+'">Delete</button>':''}</div></div>`).join(''):'<div class="empty">अभी कोई record नहीं है।</div>';document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(b.dataset.edit,data));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>remove(b.dataset.del));}catch(e){$('items').innerHTML='<div class="empty">'+esc(e.message)+'</div>';}}
async function edit(id,data){const x=data.find(a=>a.id===id);if(!x)return;editingId=id;renderForm(x);window.scrollTo({top:0,behavior:'smooth'});}
async function save(e){e.preventDefault();const t=tables[current],body={};t.fields.forEach(([key,,type])=>{const el=$('f_'+key);if(!el)return;body[key]=type==='checkbox'?el.checked:(type==='number'?(Number(el.value)||0):el.value);});try{await api('/api/admin/content?table='+current+(editingId?'&id='+encodeURIComponent(editingId):''),{method:editingId?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});show('Saved successfully');editingId=null;renderForm();load();}catch(e){alert(e.message)}}
async function remove(id){if(!confirm('इस record को delete करें?'))return;try{await api('/api/admin/content?table='+current+'&id='+encodeURIComponent(id),{method:'DELETE'});show('Deleted');load();}catch(e){alert(e.message)}}
function show(m){$('status').textContent=m;$('status').style.display='block';setTimeout(()=>$('status').style.display='none',2500)}
$('loginForm').onsubmit=async e=>{e.preventDefault();$('error').style.display='none';try{await api('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('username').value,password:$('password').value})});start();}catch(e){$('error').textContent=e.message;$('error').style.display='block'}};
$('logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});location.reload()};
async function start(){try{const me=await api('/api/admin/me');if(!me.authenticated)throw 0;$('login').style.display='none';$('dashboard').style.display='block';renderTabs();renderForm();load();}catch{}}
start();
</script>
</body></html>
