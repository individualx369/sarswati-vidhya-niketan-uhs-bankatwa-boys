<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Management | Admin</title><style>body{margin:0;font-family:system-ui,"Noto Sans Devanagari",sans-serif;background:#f5f7fb;color:#172033}.wrap{max-width:1100px;margin:auto;padding:22px}.head{background:#0b2545;color:#fff}.card{background:#fff;border:1px solid #e4e7ec;border-radius:16px;padding:20px;margin-top:18px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}input,select,textarea{width:100%;padding:11px;border:1px solid #ccd4df;border-radius:9px;box-sizing:border-box;font:inherit}label{font-weight:700;font-size:14px}.field{display:grid;gap:6px}button{border:0;border-radius:9px;padding:12px 16px;background:#f47b20;color:#fff;font-weight:800;cursor:pointer;margin-top:12px}.secondary{background:#0b2545}.table{overflow:auto;margin-top:18px}table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:10px;border-bottom:1px solid #eee;text-align:left;white-space:nowrap}.success{background:#ecfdf3;color:#027a48;padding:12px;border-radius:9px;margin-top:12px;display:none}.error{background:#fef3f2;color:#b42318;padding:12px;border-radius:9px;margin-top:12px;display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="head"><div class="wrap"><strong>Student Management</strong><div>UHS BANKATWA • Admin</div></div></header><main class="wrap"><div class="card"><h2>नया विद्यार्थी जोड़ें</h2><div class="grid"><div class="field"><label>पूरा नाम *</label><input id="full_name"></div><div class="field"><label>Admission No. *</label><input id="admission_no"></div><div class="field"><label>Roll No.</label><input id="roll_no"></div><div class="field"><label>Class *</label><select id="class_level"><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select></div><div class="field"><label>Session *</label><input id="academic_session" placeholder="2026-27 / 2026-28"></div><div class="field"><label>Stream</label><input id="stream" placeholder="Science / Arts / Commerce"></div><div class="field"><label>Father Name</label><input id="father_name"></div><div class="field"><label>Mother Name</label><input id="mother_name"></div><div class="field"><label>Date of Birth</label><input id="date_of_birth" type="date"></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Registration No.</label><input id="registration_no"></div><div class="field"><label>BSEB Roll Code</label><input id="bseb_roll_code"></div><div class="field"><label>BSEB Roll No.</label><input id="bseb_roll_no"></div></div><button onclick="addStudent()">विद्यार्थी जोड़ें और Access Code बनाएं</button><div id="success" class="success"></div><div id="error" class="error"></div></div><div class="card"><h2>विद्यार्थी खोजें</h2><input id="search" placeholder="नाम / Admission No. / Roll No." oninput="loadStudents()"><div class="table"><table><thead><tr><th>नाम</th><th>Admission</th><th>Roll</th><th>Class</th><th>Session</th><th>Portal</th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading...</td></tr></tbody></table></div></div></main><script>async function addStudent(){const fields=['full_name','admission_no','roll_no','class_level','academic_session','stream','father_name','mother_name','date_of_birth','phone','email','registration_no','bseb_roll_code','bseb_roll_no'];const b=Object.fromEntries(fields.map(id=>[id,document.getElementById(id).value]));hide();try{const r=await fetch('/api/admin/students',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const d=await r.json();if(!r.ok)throw new Error(d.error||'Failed');const s=document.getElementById('success');s.style.display='block';s.innerHTML='<b>Student created.</b><br>Access Code: <strong>'+d.access_code+'</strong><br>इसे केवल verified student को दें और सुरक्षित रखें।';document.getElementById('admission_no').value='';document.getElementById('full_name').value='';loadStudents()}catch(e){showError(e.message)}}async function loadStudents(){try{const q=document.getElementById('search').value;const r=await fetch('/api/admin/students?q='+encodeURIComponent(q));const d=await r.json();if(!r.ok)throw new Error(d.error||'Failed');document.getElementById('rows').innerHTML=(d.students||[]).map(s=>'<tr><td>'+esc(s.full_name)+'</td><td>'+esc(s.admission_no)+'</td><td>'+esc(s.roll_no||'-')+'</td><td>'+esc(s.class_level)+'</td><td>'+esc(s.academic_session)+'</td><td>'+ (s.portal_enabled?'Enabled':'Pending')+'</td></tr>').join('')||'<tr><td colspan="6">No students</td></tr>'}catch(e){document.getElementById('rows').innerHTML='<tr><td colspan="6">Admin login required</td></tr>'}}function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function hide(){document.getElementById('success').style.display='none';document.getElementById('error').style.display='none'}function showError(x){const e=document.getElementById('error');e.style.display='block';e.textContent=x}loadStudents();</script></body></html>
